<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f2847;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0d060;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="35%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Glows -->
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="200" r="300" fill="none" stroke="rgba(212,175,55,0.05)" stroke-width="1"/>
  <circle cx="150" cy="200" r="250" fill="none" stroke="rgba(212,175,55,0.03)" stroke-width="1"/>
  <circle cx="1770" cy="880" r="350" fill="none" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  <circle cx="1770" cy="880" r="280" fill="none" stroke="rgba(59,130,246,0.03)" stroke-width="1"/>
  
  <!-- Bank building silhouette -->
  <g opacity="0.04" fill="white">
    <!-- Main building -->
    <rect x="800" y="300" width="320" height="500" rx="4"/>
    <!-- Pillars -->
    <rect x="820" y="350" width="30" height="400" rx="2"/>
    <rect x="880" y="350" width="30" height="400" rx="2"/>
    <rect x="940" y="350" width="30" height="400" rx="2"/>
    <rect x="1000" y="350" width="30" height="400" rx="2"/>
    <rect x="1060" y="350" width="30" height="400" rx="2"/>
    <!-- Roof -->
    <polygon points="780,300 960,200 1140,300"/>
    <!-- Base -->
    <rect x="760" y="750" width="400" height="50" rx="4"/>
  </g>
  
  <!-- Currency symbols -->
  <g opacity="0.03" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">
    <text x="200" y="500">$</text>
    <text x="1600" y="300">€</text>
    <text x="400" y="800">£</text>
    <text x="1400" y="700">¥</text>
    <text x="300" y="300">S</text>
    <text x="1500" y="500">د.إ</text>
  </g>
  
  <!-- Gold accent lines -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="rgba(212,175,55,0.1)" stroke-width="1"/>
  <line x1="1520" y1="980" x2="1920" y2="980" stroke="rgba(212,175,55,0.1)" stroke-width="1"/>
</svg>
