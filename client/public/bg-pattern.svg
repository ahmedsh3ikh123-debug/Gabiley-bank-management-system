<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="0.5" fill="#d1d5db" opacity="0.3"/>
      <circle cx="0" cy="0" r="0.5" fill="#d1d5db" opacity="0.3"/>
      <circle cx="100" cy="0" r="0.5" fill="#d1d5db" opacity="0.3"/>
      <circle cx="0" cy="100" r="0.5" fill="#d1d5db" opacity="0.3"/>
      <circle cx="100" cy="100" r="0.5" fill="#d1d5db" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#grid)"/>
</svg>
